# Hermes Agent config.yaml — local LLM (OpenAI-compatible server)
# ====================================================
# Copy or symlink this into /mnt/user/appdata/hermes-agent/config.yaml
# after first install to bypass OpenRouter and use the local model server.
#
# Start one model container at a time: qwen38-flash-next-gufo or
# deepseek-v4-flash-vulkan. Keep model.default in sync with the served id.

model:
  default: Qwen3.8-Flash-Next-UD-Q4_K_XL
  provider: local-llm
  base_url: http://192.168.1.214:9931/v1

custom_providers:
  - name: local-llm
    base_url: http://192.168.1.214:9931/v1
    api_key: ""

# For the DeepSeek container instead:
#   default: deepseek-v4-flash
#   provider: local-llm

# ── Optional tweaks ──────────────────────────────────────────────────
# Uncomment and adjust as needed:

# display:
#   streaming: true           # stream tokens as they arrive
#   show_reasoning: false      # hide model reasoning from chat output

# agent:
#   max_turns: 60              # max tool-call rounds per session
#   verify_on_stop: false      # skip "are you sure?" on stop
